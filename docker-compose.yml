services:
  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-web_game}
      POSTGRES_USER: ${POSTGRES_USER:-web_game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-web_game}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-web_game} -d ${POSTGRES_DB:-web_game}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://web_game:web_game@postgres:5432/web_game
      REDIS_URL: redis://redis:6379/0
      # LAN_IP — IP машины-хоста для теста с других устройств в сети (телефон).
      # Задаётся в локальном .env (LAN_IP=192.168.x.x); по умолчанию localhost.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend,${LAN_IP:-localhost}
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://0.0.0.0:3000,http://${LAN_IP:-localhost}:3000
      DJANGO_CSRF_TRUSTED_ORIGINS: http://${LAN_IP:-localhost}:3000,http://${LAN_IP:-localhost}:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
    command: python -m celery -A config worker -l info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://web_game:web_game@postgres:5432/web_game
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    depends_on:
      backend:
        condition: service_started

  celery_beat:
    build:
      context: ./backend
    command: python -m celery -A config beat -l info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://web_game:web_game@postgres:5432/web_game
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://${LAN_IP:-localhost}:8000/api
      LAN_IP: ${LAN_IP:-}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  backend_media:

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ashreach — Async Dungeon RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Backgrounds — deep navy ladder per spec */
  --bg-0: #0B1020;
  --bg-1: #111827;
  --bg-2: #1A2235;
  --bg-3: #202B44;
  --bg-4: #2A375A;
  --line: #2E3B5A;
  --line-soft: #243150;
  --line-hover: #4B6AA3;

  /* Text */
  --text: #E5E7EB;
  --text-dim: #94A3B8;
  --text-mute: #64748B;
  --bone: #F1F5F9;

  /* Primary accents — Diablo-blue */
  --primary: #3B82F6;
  --primary-deep: #2563EB;
  --primary-bright: #60A5FA;
  --cyan: #38BDF8;

  /* Aliases kept for codebase compatibility */
  --ember: var(--primary);
  --ember-soft: var(--primary-bright);
  --ember-deep: var(--primary-deep);

  /* Rarity per spec */
  --rare-common:   #9CA3AF;
  --rare-uncommon: #22C55E;
  --rare-rare:     #3B82F6;
  --rare-epic:     #A855F7;

  /* Status */
  --success: #22C55E;
  --error:   #EF4444;
  --warning: #F59E0B;
  --info:    #38BDF8;
  --moss:    #22C55E;
  --blood:   #EF4444;
  --gold:    #F59E0B;

  /* Shadows */
  --shadow-blue: 0 0 12px rgba(59, 130, 246, 0.15);
  --shadow-blue-strong: 0 0 24px rgba(59, 130, 246, 0.28);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg-0);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  background-image:
    radial-gradient(1200px 700px at 85% -10%, rgba(59, 130, 246, 0.10), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(99, 102, 241, 0.08), transparent 55%);
}
.serif { font-family: 'Cinzel', 'Times New Roman', serif; letter-spacing: 0.02em; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg-1); }
::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 100px; border: 2px solid var(--bg-1); }
::-webkit-scrollbar-thumb:hover { background: var(--line-hover); }
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
.app { min-height: 100vh; display: grid; grid-template-columns: 240px minmax(0, 1fr); }

/* Sidebar */
.sidebar {
  background: linear-gradient(180deg, var(--bg-1), var(--bg-0));
  border-right: 1px solid var(--line);
  padding: 28px 18px;
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 4px;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 0 6px 22px; border-bottom: 1px solid var(--line-soft); margin-bottom: 18px;
}
.brand-mark {
  width: 36px; height: 36px; border-radius: 8px;
  background: linear-gradient(135deg, var(--primary), var(--primary-deep));
  position: relative;
  box-shadow: inset 0 -10px 16px rgba(15,23,42,0.6), 0 0 24px rgba(59,130,246,0.35);
}
.brand-mark::after {
  content: ""; position: absolute; inset: 6px; border: 1px solid rgba(15,23,42,0.7);
  border-radius: 4px;
}
.brand-name { font-family: 'Cinzel', 'Times New Roman', serif; font-size: 22px; font-weight: 600; letter-spacing: 0.02em; }
.brand-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-mute); letter-spacing: 0.18em; text-transform: uppercase; }

.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 6px;
  color: var(--text-dim); cursor: pointer; user-select: none;
  font-size: 13px; font-weight: 500; letter-spacing: 0.01em;
  border: 1px solid transparent;
  transition: all 140ms ease;
}
.nav-item:hover { background: var(--bg-2); color: var(--text); }
.nav-item.active {
  background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
  color: var(--bone); border-color: var(--line);
  box-shadow: inset 0 1px 0 oklch(0.35 0.02 60 / 0.4);
}
.nav-item.active .nav-glyph { color: var(--primary-bright); }
.nav-glyph {
  width: 18px; text-align: center; font-family: 'JetBrains Mono', monospace;
  font-size: 13px; color: var(--text-mute);
}
.nav-badge {
  margin-left: auto; font-family: 'JetBrains Mono', monospace;
  font-size: 10px; padding: 2px 6px; border-radius: 3px;
  background: var(--ember); color: oklch(0.18 0.02 50); font-weight: 600;
}
.nav-section-label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.20em; text-transform: uppercase;
  color: var(--text-mute); padding: 18px 12px 6px;
}
.sidebar-footer {
  margin-top: auto; padding-top: 18px; border-top: 1px solid var(--line-soft);
  display: flex; flex-direction: column; gap: 12px;
}
.sidebar-version {
  font-size: 10px; color: var(--text-mute);
  letter-spacing: 0.18em; text-transform: uppercase;
  padding: 0 2px;
}
.avatar-sm {
  width: 36px; height: 36px; border-radius: 4px;
  background: repeating-linear-gradient(45deg, var(--bg-3) 0 6px, var(--bg-2) 6px 12px);
  border: 1px solid var(--line);
}

/* Main */
.main { padding: 28px 36px 60px; max-width: 1400px; min-width: 0; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px;
}
.topbar-left h1 {
  font-family: 'Cinzel', 'Times New Roman', serif;
  font-weight: 600; font-size: 28px; margin: 0;
  letter-spacing: 0.04em;
}
.topbar-left .kicker {
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  color: var(--text-mute); letter-spacing: 0.20em; text-transform: uppercase;
  margin-bottom: 4px;
}
.topbar-right { display: flex; align-items: center; gap: 12px; }
.stat-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 10px;
  background: var(--bg-2); border: 1px solid var(--line);
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  white-space: nowrap;
}
.stat-chip .lbl { color: var(--text-mute); letter-spacing: 0.12em; text-transform: uppercase; font-size: 10px; }
.stat-chip .val { color: var(--bone); font-weight: 600; }
.stat-chip.gold .val { color: var(--gold); }
.stat-chip.ember .val { color: var(--ember); }

/* Card */
.card {
  background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
  border: 1px solid var(--line);
  border-radius: 14px;
  position: relative;
  box-shadow: var(--shadow-blue);
}
.card-h {
  padding: 16px 20px; border-bottom: 1px solid var(--line-soft);
  display: flex; align-items: center; justify-content: space-between;
}
.card-title {
  font-family: 'Cinzel', 'Times New Roman', serif; font-size: 18px;
  font-weight: 600; letter-spacing: 0.04em;
}
.card-sub {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-mute);
}
.card-body { padding: 20px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px; border-radius: 10px;
  font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
  letter-spacing: 0.01em; border: 1px solid var(--line);
  background: var(--bg-3); color: var(--text);
  cursor: pointer; transition: all 180ms ease;
}
.btn:hover { background: var(--bg-4); border-color: var(--line-hover); }
.btn.primary {
  background: var(--primary-deep);
  color: #fff; border-color: var(--primary);
  font-weight: 600;
  box-shadow: 0 0 16px rgba(59,130,246,0.30);
}
.btn.primary:hover { background: var(--primary); box-shadow: 0 0 22px rgba(59,130,246,0.45); }
.btn.ghost { background: transparent; }
.btn.danger { color: #fff; background: var(--error); border-color: var(--error); }
.btn.danger:hover { background: #DC2626; border-color: #DC2626; }
.btn.lg { padding: 14px 28px; font-size: 14px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* Bar */
.bar { width: 100%; height: 6px; background: var(--bg-2); border-radius: 100px; overflow: hidden; position: relative; border: 1px solid var(--line-soft); }
.bar > i { display: block; height: 100%; background: var(--ember); }
.bar.xp > i { background: linear-gradient(90deg, var(--ember-deep), var(--ember)); }
.bar.hp > i { background: linear-gradient(90deg, oklch(0.45 0.14 25), var(--blood)); }
.bar.dur > i { background: var(--moss); }
.bar.dur.warn > i { background: var(--ember); }
.bar.dur.crit > i { background: var(--blood); }

/* Misc */
.row { display: flex; gap: 18px; }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }

.divider { height: 1px; background: var(--line-soft); margin: 14px 0; }

.tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px; border-radius: 3px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.10em; text-transform: uppercase;
  background: var(--bg-2); border: 1px solid var(--line-soft); color: var(--text-dim);
}
.tag.rare-common { color: var(--rare-common); border-color: #475569; background: rgba(148,163,184,0.08); }
.tag.rare-uncommon { color: var(--rare-uncommon); border-color: rgba(34,197,94,0.45); background: rgba(34,197,94,0.10); }
.tag.rare-rare { color: var(--rare-rare); border-color: rgba(59,130,246,0.45); background: rgba(59,130,246,0.10); }
.tag.rare-epic { color: var(--rare-epic); border-color: rgba(168,85,247,0.45); background: rgba(168,85,247,0.10); }
.tag.rare-legendary { color: var(--warning); border-color: rgba(245,158,11,0.45); background: rgba(245,158,11,0.10); }

.kbd {
  display: inline-block; font-family: 'JetBrains Mono', monospace;
  font-size: 10px; padding: 2px 6px; border-radius: 3px;
  background: var(--bg-2); border: 1px solid var(--line); color: var(--text-dim);
}

/* Equipment slot */
.slot {
  aspect-ratio: 1;
  background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
  border: 1px solid var(--line); border-radius: 10px;
  position: relative; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 180ms ease;
}
.slot:hover { border-color: var(--line-hover); box-shadow: var(--shadow-blue); }
.slot.empty { border-style: dashed; border-color: var(--line-soft); background: transparent; }
.slot .slot-name {
  position: absolute; bottom: 4px; left: 0; right: 0; text-align: center;
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  color: var(--text-mute); letter-spacing: 0.10em; text-transform: uppercase;
}
.slot .slot-glyph {
  font-family: 'Cinzel', 'Times New Roman', serif; font-size: 28px; color: var(--text);
}
.slot .slot-rare { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 100px; }
.slot .slot-dur { position: absolute; top: 5px; left: 5px; right: 16px; height: 3px; border-radius: 100px; background: var(--bg-3); overflow: hidden; }
.slot .slot-dur i { display: block; height: 100%; background: var(--moss); }

/* Dungeon card */
.dungeon {
  background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
  border: 1px solid var(--line); border-radius: 16px;
  overflow: hidden; display: flex; flex-direction: column;
  transition: all 200ms ease; cursor: pointer;
  box-shadow: var(--shadow-blue);
}
.dungeon:hover { border-color: var(--line-hover); transform: translateY(-2px); box-shadow: var(--shadow-blue-strong); }
.dungeon.locked { opacity: 0.55; cursor: not-allowed; }
.dungeon.active { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset, 0 0 30px rgba(59,130,246,0.30); }
.dungeon-hero {
  height: 130px; position: relative;
  background:
    repeating-linear-gradient(135deg, oklch(0.20 0.02 60 / 0.4) 0 6px, transparent 6px 12px),
    linear-gradient(180deg, var(--bg-3), var(--bg-1));
  border-bottom: 1px solid var(--line-soft);
  display: flex; align-items: flex-end; padding: 12px;
}
.dungeon-hero .ph-label {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-mute);
  background: var(--bg-1); padding: 3px 6px; border-radius: 2px;
}
.dungeon-hero.tier-1 { background: linear-gradient(180deg, rgba(34,197,94,0.18), var(--bg-2)), repeating-linear-gradient(135deg, rgba(0,0,0,0.25) 0 6px, transparent 6px 12px); }
.dungeon-hero.tier-2 { background: linear-gradient(180deg, rgba(59,130,246,0.22), var(--bg-2)), repeating-linear-gradient(135deg, rgba(0,0,0,0.25) 0 6px, transparent 6px 12px); }
.dungeon-hero.tier-3 { background: linear-gradient(180deg, rgba(168,85,247,0.25), var(--bg-2)), repeating-linear-gradient(135deg, rgba(0,0,0,0.25) 0 6px, transparent 6px 12px); }
.dungeon-hero.tier-4 { background: linear-gradient(180deg, rgba(245,158,11,0.28), var(--bg-2)), repeating-linear-gradient(135deg, rgba(0,0,0,0.25) 0 6px, transparent 6px 12px); }
.dungeon-hero .tier-tag {
  position: absolute; top: 10px; right: 10px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  padding: 3px 8px; background: var(--bg-1);
  border: 1px solid var(--line); border-radius: 2px;
  color: var(--text-dim); letter-spacing: 0.12em;
}
.dungeon-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.dungeon-body h3 { font-family: 'Cinzel', 'Times New Roman', serif; font-size: 20px; font-weight: 600; margin: 0; line-height: 1.2; letter-spacing: 0.03em; text-wrap: balance; min-width: 0; flex: 1; }
.dungeon-body p { color: var(--text-dim); font-size: 12px; margin: 0; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dungeon-cta { margin-top: auto; padding-top: 4px; }
.dungeon-meta { display: flex; gap: 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-mute); }
.dungeon-meta b { color: var(--bone); font-weight: 500; }

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0; background: oklch(0.08 0.005 60 / 0.75);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center; z-index: 100;
  animation: fade-in 200ms ease;
}
.modal {
  width: 540px; max-width: 92vw;
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 16px; padding: 0;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 40px rgba(59,130,246,0.18);
  animation: pop-in 240ms cubic-bezier(.2,.9,.3,1.2);
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop-in { from { opacity: 0; transform: translateY(8px) scale(0.96); } to { opacity: 1; transform: none; } }

/* Item ph */
.item-ph {
  width: 40px; height: 40px; border-radius: 2px;
  background: repeating-linear-gradient(45deg, var(--bg-3) 0 4px, var(--bg-2) 4px 8px);
  border: 1px solid var(--line-soft);
}
.item-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border: 1px solid var(--line-soft); border-radius: 4px;
  background: var(--bg-1);
  transition: all 140ms ease; cursor: pointer;
}
.item-row:hover { background: var(--bg-2); border-color: var(--line); }
.item-row .name { font-family: 'Cinzel', 'Times New Roman', serif; font-size: 16px; font-weight: 500; }
.item-row .sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-mute); letter-spacing: 0.10em; text-transform: uppercase; }

/* Timer */
.timer-ring {
  width: 220px; height: 220px; position: relative;
  display: flex; align-items: center; justify-content: center;
}
.timer-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.timer-ring .digits {
  font-family: 'JetBrains Mono', monospace; font-size: 38px; font-weight: 500;
  letter-spacing: 0.04em; color: var(--bone);
  font-variant-numeric: tabular-nums;
}
.timer-ring .label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.20em; text-transform: uppercase; color: var(--text-mute);
  margin-top: 6px;
}

/* Log */
.log-line {
  display: flex; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px;
  padding: 6px 0; border-bottom: 1px dashed var(--line-soft);
}
.log-line:last-child { border: 0; }
.log-line .t { color: var(--text-mute); width: 50px; flex-shrink: 0; }
.log-line .m { color: var(--text-dim); }
.log-line.crit .m { color: var(--ember); }
.log-line.loot .m { color: var(--gold); }
.log-line.dmg .m { color: var(--blood); }

/* Stat list */
.stat-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 28px; }
.stat-list .sl-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 0; border-bottom: 1px dashed var(--line-soft);
}
.stat-list .sl-row:last-child { border: 0; }
.stat-list .lbl { font-size: 12px; color: var(--text-dim); }
.stat-list .val { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--bone); font-variant-numeric: tabular-nums; }
.stat-list .delta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--moss); margin-left: 6px; }

/* Hero portrait */
.portrait {
  aspect-ratio: 3/4;
  background:
    radial-gradient(ellipse at 50% 30%, oklch(0.30 0.06 55 / 0.6), transparent 70%),
    repeating-linear-gradient(135deg, var(--bg-2) 0 8px, var(--bg-1) 8px 16px);
  border: 1px solid var(--line); border-radius: 4px;
  position: relative; overflow: hidden;
}
.portrait .ph-label {
  position: absolute; bottom: 12px; left: 12px;
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-mute);
  background: var(--bg-1); padding: 4px 8px; border-radius: 2px;
}
.portrait .lvl-badge {
  position: absolute; top: 12px; left: 12px;
  font-family: 'Cinzel', 'Times New Roman', serif; font-size: 38px; font-weight: 600;
  color: var(--bone); line-height: 1; text-shadow: 0 2px 12px rgba(0,0,0,0.6);
}
.portrait .lvl-badge .lbl { display: block; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.20em; color: var(--text-mute); margin-bottom: 2px; }

/* Toast */
.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  background: var(--bg-2); border: 1px solid var(--ember-soft);
  padding: 12px 20px; border-radius: 4px;
  font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--bone);
  box-shadow: 0 12px 40px oklch(0 0 0 / 0.5);
  z-index: 200; animation: slide-up 240ms cubic-bezier(.2,.9,.3,1.2);
}
@keyframes slide-up { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* Section header */
.section-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
.section-h h2 { font-family: 'Cinzel', 'Times New Roman', serif; font-size: 26px; font-weight: 500; margin: 0; letter-spacing: 0.005em; }
.section-h .sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-mute); letter-spacing: 0.20em; text-transform: uppercase; }

/* ===== Dashboard 3-col layout ===== */
.dashboard {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr) 300px;
  gap: 18px;
  align-items: start;
}
@media (max-width: 1380px) {
  .dashboard { grid-template-columns: 280px minmax(0, 1fr) 280px; gap: 14px; }
}
@media (max-width: 1200px) {
  .dashboard { grid-template-columns: 280px minmax(0, 1fr); }
  .dashboard .inventory-card { grid-column: 1 / -1; }
}
@media (max-width: 860px) {
  .dashboard { grid-template-columns: 1fr; }
}

/* Equipment paperdoll layout */
.equipment-layout {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-width: 360px;
  margin: 0 auto;
}

/* Attribute pills */
.attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.attr-pill {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 10px;
  background: var(--bg-1); border: 1px solid var(--line);
  font-size: 13px;
}
.attr-pill .mono { font-size: 11px; color: var(--text-mute); letter-spacing: 0.12em; }
.attr-pill .serif { flex: 1; font-size: 18px; font-weight: 600; color: var(--bone); text-align: right; font-family: 'Cinzel', serif; }
.attr-btn {
  width: 22px; height: 22px; border-radius: 6px;
  background: var(--primary-deep); color: #fff; border: none;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all 160ms ease;
}
.attr-btn:hover { background: var(--primary); box-shadow: 0 0 10px rgba(59,130,246,0.5); }

/* Active expedition strip */
.active-strip {
  background: linear-gradient(180deg, rgba(59,130,246,0.10), var(--bg-2));
  box-shadow: var(--shadow-blue-strong);
}

/* Quick dungeons */
.quick-dungeons { display: flex; flex-direction: column; gap: 10px; }
.quick-d {
  display: flex; align-items: center; gap: 14px;
  padding: 10px; border-radius: 12px;
  background: var(--bg-1); border: 1px solid var(--line);
  cursor: pointer; transition: all 180ms ease;
}
.quick-d:hover { border-color: var(--line-hover); background: var(--bg-3); box-shadow: var(--shadow-blue); }
.quick-d.locked { opacity: 0.5; cursor: not-allowed; }
.quick-d-art {
  width: 64px; height: 64px; border-radius: 8px;
  background: var(--bg-3); border: 1px solid var(--line-soft);
  flex-shrink: 0;
}
.quick-d-art.tier-1 { background: linear-gradient(135deg, rgba(34,197,94,0.30), var(--bg-2)); }
.quick-d-art.tier-2 { background: linear-gradient(135deg, rgba(59,130,246,0.30), var(--bg-2)); }
.quick-d-art.tier-3 { background: linear-gradient(135deg, rgba(168,85,247,0.32), var(--bg-2)); }
.quick-d-art.tier-4 { background: linear-gradient(135deg, rgba(245,158,11,0.35), var(--bg-2)); }

/* Inventory grid */
.inv-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.inv-cell {
  aspect-ratio: 1;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 8px;
  position: relative;
  cursor: pointer;
  transition: all 160ms ease;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.inv-cell:not(.empty):hover { transform: translateY(-1px); }
.inv-cell.empty { border-style: dashed; border-color: var(--line-soft); background: rgba(0,0,0,0.15); }
.inv-icon {
  width: 60%; height: 60%; border-radius: 4px;
  background: repeating-linear-gradient(45deg, var(--bg-3) 0 4px, var(--bg-2) 4px 8px);
  border: 1px solid var(--line-soft);
}
.broken-tag {
  position: absolute; top: 3px; right: 3px;
  width: 14px; height: 14px; border-radius: 100px;
  background: var(--error); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  font-family: 'Inter', sans-serif;
}
.inv-dur {
  position: absolute; bottom: 3px; left: 4px; right: 4px;
  height: 3px; border-radius: 100px; background: rgba(0,0,0,0.4); overflow: hidden;
}
.inv-dur i { display: block; height: 100%; }

/* Language toggle */
.lang-toggle {
  display: inline-flex;
  padding: 3px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  gap: 0;
}
.lang-opt {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--text-mute);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.10em;
  padding: 6px 12px;
  border-radius: 7px;
  cursor: pointer;
  transition: all 160ms ease;
}
.lang-opt:hover { color: var(--text); }
.lang-opt.active {
  background: linear-gradient(180deg, var(--primary), var(--primary-deep));
  color: #fff;
  box-shadow: 0 0 12px rgba(59,130,246,0.45);
}

/* Currency chip — gold / silver / copper */
.currency-chip {
  display: inline-flex; align-items: center;
  gap: 10px;
  padding: 8px 14px; border-radius: 10px;
  background: var(--bg-2); border: 1px solid var(--line);
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  white-space: nowrap;
  box-shadow: var(--shadow-blue);
}
.coin-pair { display: inline-flex; align-items: center; gap: 4px; }
.coin-pair + .coin-pair { padding-left: 8px; border-left: 1px solid var(--line-soft); }
.coin {
  width: 12px; height: 12px; border-radius: 100px;
  border: 1px solid rgba(0,0,0,0.45);
  display: inline-block;
  box-shadow: inset 0 -2px 3px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.25);
}
.coin-gold   { background: radial-gradient(circle at 35% 30%, #FBE08A, #C28F1A 70%, #6F4A06); }
.coin-silver { background: radial-gradient(circle at 35% 30%, #F5F7FB, #A8B0C0 70%, #6E7587); }
.coin-copper { background: radial-gradient(circle at 35% 30%, #F1A877, #B66A2C 70%, #5D3008); }
.coin-val { color: var(--bone); font-weight: 600; font-variant-numeric: tabular-nums; }
.coin-suf { color: var(--text-mute); font-size: 10px; letter-spacing: 0.06em; }

/* Settings */
.settings-grid { max-width: 900px; }
.lang-cards {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.lang-card {
  appearance: none; border: 1px solid var(--line);
  background: var(--bg-1); color: var(--text);
  padding: 18px 20px; border-radius: 12px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  cursor: pointer; transition: all 180ms ease;
  position: relative;
  font-family: inherit;
}
.lang-card:hover { border-color: var(--line-hover); background: var(--bg-3); box-shadow: var(--shadow-blue); }
.lang-card.active {
  border-color: var(--primary);
  background: linear-gradient(180deg, rgba(59,130,246,0.12), var(--bg-2));
  box-shadow: 0 0 0 1px var(--primary) inset, var(--shadow-blue-strong);
}
.lang-card-code {
  font-family: 'Cinzel', serif;
  font-size: 26px; font-weight: 700;
  letter-spacing: 0.10em;
  color: var(--primary-bright);
}
.lang-card.active .lang-card-code { color: var(--bone); }
.lang-card-name {
  font-size: 12px; color: var(--text-dim);
  letter-spacing: 0.04em;
}
.lang-card-check {
  position: absolute; top: 12px; right: 14px;
  width: 22px; height: 22px; border-radius: 100px;
  background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700;
  box-shadow: 0 0 10px rgba(59,130,246,0.55);
}
.setting-row {
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
  padding: 6px 0;
}
.seg-toggle {
  display: inline-flex; padding: 3px;
  background: var(--bg-1); border: 1px solid var(--line);
  border-radius: 10px;
}
.seg-opt {
  appearance: none; border: 0; background: transparent;
  color: var(--text-dim); padding: 6px 14px;
  border-radius: 7px; font-size: 12px; cursor: pointer;
  font-family: inherit;
}
.seg-opt.active {
  background: linear-gradient(180deg, var(--primary), var(--primary-deep));
  color: #fff; font-weight: 600;
}

</style>

  };
}

function formatTime(ms) {
  if (ms <= 0) return '00:00';
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor(s % 3600 / 60);
  const r = s % 60;
  if (h > 0) return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
  return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
}

function durabilityClass(p) {
  if (p < 0.20) return 'crit';
  if (p < 0.45) return 'warn';
  return '';
}

function sumStats(equipment) {
  const t = { attack: 0, armor: 0, hp: 0, crit: 0, block: 0 };
  Object.values(equipment).forEach((it) => {
    if (!it) return;
    Object.entries(it.stats).forEach(([k, v]) => {t[k] = (t[k] || 0) + v;});
  });
  return t;
}

function Bar({ kind = '', value, max, height = 6 }) {
  const pct = Math.max(0, Math.min(1, value / max));
  const cls = kind === 'dur' ? `bar dur ${durabilityClass(pct)}` : `bar ${kind}`;
  return (
    <div className={cls} style={{ height }}>
      <i style={{ width: `${pct * 100}%` }}></i>
    </div>);

}

function Tag({ rarity, children }) {
  return <span className={`tag rare-${rarity}`}>{children || RARITY[rarity].label}</span>;
}

function StatChip({ label, value, tone }) {
  return (
    <div className={`stat-chip ${tone || ''}`}>
      <span className="lbl">{label}</span>
      <span className="val">{value}</span>
    </div>);

}

function splitCoin(total) {
  const n = Math.max(0, Math.floor(total));
  return {
    gold:   Math.floor(n / 10000),
    silver: Math.floor((n % 10000) / 100),
    copper: n % 100,
  };
}

function CurrencyChip({ total }) {
  const t = useT();
  const c = splitCoin(total);
  const show = [];
  if (c.gold > 0)   show.push({ k: 'g', v: c.gold,   cls: 'gold' });
  if (c.silver > 0 || c.gold > 0) show.push({ k: 's', v: c.silver, cls: 'silver' });
  show.push({ k: 'c', v: c.copper, cls: 'copper' });
  return (
    <div className="currency-chip" title={t('gold')}>
      {show.map((p, i) => (
        <span key={p.k} className="coin-pair">
          <span className={`coin coin-${p.cls}`}></span>
          <span className="coin-val">{p.v}</span>
          <span className="coin-suf">{t('coin' + p.cls.charAt(0).toUpperCase() + p.cls.slice(1))}</span>
        </span>
      ))}
    </div>
  );
}

function ActiveExpeditionStrip({ expedition, dungeon, now, onOpen, onClaim }) {
  const t = useT();
  const total = expedition.duration;
  const elapsed = Math.max(0, Math.min(total, now - expedition.startedAt));
  const remaining = Math.max(0, total - elapsed);
  const progress = total > 0 ? Math.max(0, Math.min(1, elapsed / total)) : 0;
  const done = remaining === 0;
  return (
    <div className="card active-strip" style={{ borderColor: done ? 'var(--warning)' : 'var(--primary)' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 18, padding: '16px 20px' }}>
        <div className={`dungeon-hero tier-${dungeon.tier}`} style={{ width: 90, height: 90, minWidth: 90, borderRadius: 10, padding: 0 }}></div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="mono" style={{ fontSize: 10, letterSpacing: '0.20em', textTransform: 'uppercase', color: done ? 'var(--warning)' : 'var(--primary-bright)' }}>

function ChronicleFeed({ startedAt, now, duration, dungeon }) {
  const t = useT();
  const elapsed = Math.min(duration, now - startedAt);
  const events = useMemo(() => buildEvents(duration, dungeon), [duration, dungeon.id]);
  const visible = events.filter((e) => e.at <= elapsed);
  return (
    <div>
      {visible.length === 0 &&
      <div className="log-line"><span className="t mono">00:00</span><span className="m">{t('chroIntro')}</span></div>
      }
      {visible.slice().reverse().map((e, i) =>
      <div key={i} className={`log-line ${e.kind || ''}`}>
          <span className="t">{formatTime(e.at)}</span>
          <span className="m">{t(e.key)}</span>
        </div>
      )}
    </div>);

}

function buildEvents(duration, dungeon) {
  const seed = dungeon.id.charCodeAt(1);
  const rand = (n) => Math.abs(Math.sin(seed * 9.7 + n * 3.1)) % 1;
  const pool = [
  { kind: '', key: 'ev1' },
  { kind: '', key: 'ev2' },
  { kind: 'crit', key: 'ev3' },
  { kind: 'dmg', key: 'ev4' },
  { kind: 'loot', key: 'ev5' },
  { kind: '', key: 'ev6' },
  { kind: 'crit', key: 'ev7' },
  { kind: 'loot', key: 'ev8' },
  { kind: 'dmg', key: 'ev9' },
  { kind: '', key: 'ev10' }];

  const n = Math.min(pool.length, Math.max(4, Math.floor(duration / 1000 / 6)));
  return Array.from({ length: n }, (_, i) => ({
    ...pool[Math.floor(rand(i) * pool.length)],
    at: Math.floor((i + 1) * (duration / (n + 1)))
  }));
}

    <div className="col settings-grid">
      <div className="card">
        <div className="card-h">
          <div>
            <div className="card-title">{t('settingsLanguage')}</div>
            <div className="card-sub mono">{t('settingsLanguageSub')}</div>
          </div>
        </div>
        <div className="card-body">
          <div className="lang-cards">
            <button
              className={`lang-card ${lang === 'en' ? 'active' : ''}`}
              onClick={() => setLang('en')}>
              <div className="lang-card-code">EN</div>
              <div className="lang-card-name">English</div>
              {lang === 'en' && <div className="lang-card-check">✓</div>}
            </button>
            <button
              className={`lang-card ${lang === 'ru' ? 'active' : ''}`}
              onClick={() => setLang('ru')}>
              <div className="lang-card-code">RU</div>
              <div className="lang-card-name">Русский</div>
              {lang === 'ru' && <div className="lang-card-check">✓</div>}
            </button>
          </div>
        </div>
      </div>

      <div className="grid-2">
        <div className="card">
          <div className="card-h">
            <div>
              <div className="card-title">{t('settingsAppearance')}</div>
              <div className="card-sub mono">{t('settingsAppearanceSub')}</div>
            </div>
          </div>
          <div className="card-body">
            <div className="setting-row">
              <div>
                <div style={{ fontSize: 13, color: 'var(--text)' }}>{t('settingsTheme')}</div>
                <div className="mono" style={{ fontSize: 10, color: 'var(--text-mute)', letterSpacing: '0.12em', textTransform: 'uppercase', marginTop: 2 }}>{t('settingsThemeDark')}</div>
              </div>
              <div className="seg-toggle">
                <button className="seg-opt active">{t('settingsThemeDark').split(' ')[0]}</button>
              </div>
            </div>
          </div>
        </div>

        <div className="card">
          <div className="card-h">
            <div>
              <div className="card-title">{t('settingsSound')}</div>
              <div className="card-sub mono">{t('settingsSoundSub')}</div>
            </div>
          </div>
          <div className="card-body">
            <div className="setting-row" style={{ alignItems: 'flex-start' }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, color: 'var(--text)' }}>{t('settingsSoundMaster')}</div>
                <div className="mono" style={{ fontSize: 10, color: 'var(--text-mute)', letterSpacing: '0.12em', textTransform: 'uppercase', marginTop: 2 }}>72%</div>
                <div className="bar" style={{ height: 6, marginTop: 8 }}><i style={{ width: '72%', background: 'linear-gradient(90deg, var(--primary-deep), var(--primary-bright))' }}></i></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-h">
          <div>
            <div className="card-title">{t('settingsAccount')}</div>
            <div className="card-sub mono">{t('settingsAccountSub')}</div>
          </div>
        </div>
        <div className="card-body">
          <div className="setting-row">
            <div>
              <div className="mono" style={{ fontSize: 10, color: 'var(--text-mute)', letterSpacing: '0.18em', textTransform: 'uppercase' }}>{t('settingsCurrentHero')}</div>
              <div className="serif" style={{ fontSize: 18, fontWeight: 600, letterSpacing: '0.04em', textTransform: 'uppercase', marginTop: 4 }}>{t(hero.nameKey)}</div>
              <div className="mono" style={{ fontSize: 11, color: 'var(--text-dim)', marginTop: 2 }}>{t(hero.classKey)} · {t('lv')} {hero.level}</div>

            <div>
              <div className="mono" style={{ fontSize: 10, color: 'var(--text-mute)', letterSpacing: '0.18em', textTransform: 'uppercase', textAlign: 'right' }}>{t('settingsVersion')}</div>
              <div className="mono" style={{ fontSize: 13, color: 'var(--bone)', marginTop: 4 }}>{t('brandSub')}</div>

}

// =====================================================================
// ROOT APP
// =====================================================================

function AppInner() {
  const t = useT();
  const [screen, setScreen] = useState('hero');
  const [hero, setHero] = useState(INITIAL_HERO);
  const [equipment, setEquipment] = useState(INITIAL_EQUIPMENT);
  const [inventory, setInventory] = useState(INVENTORY);
  const [expedition, setExpedition] = useState(null);
  const [selectedItem, setSelectedItem] = useState(null);
  const [reward, setReward] = useState(null);
  const [now, setNow] = useState(Date.now());
  const [toast, setToast] = useState(null);

  // Tick
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    if (toast) {
      const id = setTimeout(() => setToast(null), 2400);
      return () => clearTimeout(id);
    }
  }, [toast]);

  const activeDungeon = expedition ? DUNGEONS.find((d) => d.id === expedition.dungeonId) : null;

  function startExpedition(d) {
    const demoMs = d.durationMin * 1000; // 1m → 1s demo speed
    const nowT = Date.now();
    setNow(nowT);
    setExpedition({ dungeonId: d.id, startedAt: nowT, duration: demoMs, done: false });
    setScreen('expedition');
    setToast(t('toastDeparts', { name: t(d.nameKey) }));
  }

  function abortExpedition() {
    setExpedition(null);
    setToast(t('toastRecalled'));
  }

  function claimReward() {
    const d = activeDungeon;
    const gotItem = Math.random() < d.itemChance;
    const itemPool = [
    { name: 'Veylforged Spaulders', slot: 'chest', rarity: 'rare', durability: 100, dmax: 130, stats: { armor: 18, hp: 18 } },
    { name: 'Choirbone Circlet', slot: 'head', rarity: 'epic', durability: 100, dmax: 120, stats: { armor: 10, crit: 6, will: 4 } },
    { name: 'Ember-Edged Talon', slot: 'main', rarity: 'epic', durability: 100, dmax: 160, stats: { attack: 42, crit: 12 } },
    { name: 'Pact-Iron Ring', slot: 'ring', rarity: 'uncommon', durability: 100, dmax: 100, stats: { attack: 4, hp: 6 } }];

    const item = gotItem ? { ...itemPool[Math.floor(Math.random() * itemPool.length)], id: 'r' + Date.now() } : null;

    setReward({ xp: d.xp, gold: d.gold, item, dungeon: d });
    setHero((h) => ({
      ...h,
      xp: Math.min(h.xpMax, h.xp + d.xp),
      gold: h.gold + d.gold
    }));
    if (item) setInventory((inv) => [item, ...inv]);
    setEquipment((eq) => {
      const next = { ...eq };
      Object.keys(next).forEach((k) => {
        if (next[k]) next[k] = { ...next[k], durability: Math.max(0, next[k].durability - 8) };
      });
      return next;
    });
    setExpedition(null);
  }

  function repairItem(item) {
    const cost = Math.round((item.dmax - item.durability) * 2.5);
    if (hero.gold < cost) return;
    setHero((h) => ({ ...h, gold: h.gold - cost }));
    const repaired = { ...item, durability: item.dmax };
    if (equipment[item.slot] && equipment[item.slot].name === item.name) {
      setEquipment((eq) => ({ ...eq, [item.slot]: repaired }));
    } else {
      setInventory((inv) => inv.map((i) => i.id === item.id ? repaired : i));
    }
    setSelectedItem(repaired);
    setToast(t('toastRepaired', { name: item.name, n: cost }));
  }

  function repairAll() {
    const all = [...Object.values(equipment).filter(Boolean), ...inventory];
    const total = all.reduce((s, i) => s + Math.round((i.dmax - i.durability) * 2.5), 0);
    if (hero.gold < total) return;
    setHero((h) => ({ ...h, gold: h.gold - total }));
    setEquipment((eq) => {
      const next = { ...eq };
      Object.keys(next).forEach((k) => {if (next[k]) next[k] = { ...next[k], durability: next[k].dmax };});
      return next;
    });
    setInventory((inv) => inv.map((i) => ({ ...i, durability: i.dmax })));
    setToast(t('toastAllRepaired', { n: total }));
  }

  function equipFromInventory(item) {
    const current = equipment[item.slot];
    setEquipment((eq) => ({ ...eq, [item.slot]: item }));
    setInventory((inv) => {
      const filtered = inv.filter((i) => i.id !== item.id);
      return current ? [{ ...current, id: 'eq' + Date.now() }, ...filtered] : filtered;
    });
    setSelectedItem(null);
    setToast(t('toastEquipped', { name: item.name }));
  }

  const titles = {
    hero: { kicker: t('titleHeroK'), title: t('titleHero') },
    dungeons: { kicker: t('titleDungeonsK'), title: t('titleDungeons') },
    expedition: { kicker: t('titleExpK'), title: expedition ? t(activeDungeon.nameKey) : t('titleNoExp') },
    inventory: { kicker: t('titleInvK'), title: t('titleInv') },
    smithy: { kicker: t('titleSmithyK'), title: t('titleSmithy') },
    codex: { kicker: t('titleCodexK'), title: t('titleCodex') },
    settings: { kicker: t('titleSettingsK'), title: t('titleSettings') }
  };

  return (
    <div className="app">
      <Sidebar screen={screen} setScreen={setScreen} expedition={expedition} hero={hero} />

      <main className="main" data-screen-label={`${screen}`}>
        <div className="topbar">
          <div className="topbar-left">
            <div className="kicker">{titles[screen].kicker}</div>
            <h1>{titles[screen].title}</h1>
          </div>
          <div className="topbar-right">
            <StatChip label={t('lv')} value={hero.level} />
            <CurrencyChip total={hero.gold} />
            <StatChip label={t('shards')} value={hero.shards} tone="ember" />
          </div>
        </div>

        {screen === 'hero' && <HeroScreen hero={hero} equipment={equipment} inventory={inventory} expedition={expedition} now={now} setSelectedItem={setSelectedItem} setScreen={setScreen} onStart={startExpedition} onClaim={claimReward} />}
        {screen === 'dungeons' && <DungeonsScreen hero={hero} expedition={expedition} onStart={startExpedition} />}
        {screen === 'expedition' && <ExpeditionScreen expedition={expedition} dungeon={activeDungeon} now={now} onClaim={claimReward} onAbort={abortExpedition} onStart={() => setScreen('dungeons')} />}
        {screen === 'inventory' && <InventoryScreen equipment={equipment} inventory={inventory} setSelectedItem={setSelectedItem} onRepairAll={repairAll} hero={hero} />}
        {screen === 'smithy' && <SmithyScreen equipment={equipment} hero={hero} onRepairAll={repairAll} />}
        {screen === 'codex' && <CodexScreen />}
        {screen === 'settings' && <SettingsScreen hero={hero} />}
      </main>

      {selectedItem &&
      <ItemModal
        item={selectedItem}
        hero={hero}
        onClose={() => setSelectedItem(null)}
        onRepair={() => repairItem(selectedItem)}
        onEquip={inventory.find((i) => i.id === selectedItem.id) ? () => equipFromInventory(selectedItem) : null} />

      }

      {reward && <RewardModal reward={reward} onClose={() => setReward(null)} />}

      {toast && <div className="toast">{toast}</div>}
    </div>);

}

function App() {
  const [lang, setLang] = useState(() => {
    try {return localStorage.getItem('ashreach.lang') || 'ru';} catch {return 'ru';}
  });
  useEffect(() => {try {localStorage.setItem('ashreach.lang', lang);} catch {}}, [lang]);
  return (
    <LangContext.Provider value={lang}>
      <LangSetContext.Provider value={setLang}>
        <AppInner />
      </LangSetContext.Provider>
    </LangContext.Provider>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

[project]
name = "browser-async-rpg-backend"
version = "0.1.0"
description = "Django REST backend for the Browser Async RPG MVP"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Django==5.1.4",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.3.1",
    "django-cors-headers==4.6.0",
    "Pillow==12.2.0",
    "requests==2.34.2",
    "celery==5.4.0",
    "redis==5.2.1",
    "dj-database-url==2.3.0",
    "django-storages[boto3]==1.14.4",
    "psycopg[binary]==3.2.3",
    "argon2-cffi==23.1.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.2",
    "cryptography>=48.0.0",
    "django-extensions>=4.1",
    "pydantic>=2.13.4",
    "black>=26.5.1",
    "gunicorn==23.0.0",
    "whitenoise==6.8.2",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest==8.3.4",
    "pytest-django==4.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
